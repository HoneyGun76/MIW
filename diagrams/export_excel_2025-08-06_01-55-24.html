<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Export Tabel Pengujian ke Excel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .info { background: #e7f3ff; padding: 15px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Export Tabel Pengujian MIW Travel ke Excel</h1>
    
    <div class="info">
        <strong>Instruksi:</strong><br>
        1. Klik tombol "Export ke Excel" di bawah<br>
        2. File Excel akan otomatis terdownload<br>
        3. File berisi 2 sheet: Rencana Pengujian dan Hasil Pengujian
    </div>
    
    <button onclick="exportToExcel()">Export ke Excel</button>
    
    <script>
    function exportToExcel() {
        // Create workbook
        const wb = XLSX.utils.book_new();
        
        // Rencana Pengujian data
        const rencanaData = [["No.","Modul","Requirement yang diuji","Butir Uji","Jenis Pengujian"],[1,"Konektivitas","Akses halaman utama website","Ketersediaan file index.php","Black Box"],[2,"Konektivitas","Health check endpoint","Ketersediaan file health.php","Black Box"],[3,"Konektivitas","Konfigurasi sistem","Ketersediaan file config.php","Black Box"],[4,"Konektivitas","Deteksi environment Railway","Validasi environment variables","Black Box"],[5,"Pendaftaran Jamaah","Form pendaftaran umroh\/haji","Ketersediaan file form","Black Box"],[6,"Pendaftaran Jamaah","Validasi input form","Validasi NIK, email, telepon, tanggal","Black Box"],[7,"Pendaftaran Jamaah","Upload dokumen jamaah","Kemampuan upload file","Black Box"],[8,"Manajemen Paket","Pengelolaan paket perjalanan","Ketersediaan file admin paket","Black Box"],[9,"Manajemen Paket","Validasi data paket","Struktur data paket","Black Box"],[10,"Pembatalan","Form pengajuan pembatalan","Ketersediaan file pembatalan","Black Box"],[11,"Pembatalan","Verifikasi pembatalan","Proses verifikasi admin","Black Box"],[12,"Administratif","Panel administrasi","Akses file admin dashboard","Black Box"],[13,"Administratif","Export manifest jamaah","Fungsi export data","Black Box"],[14,"Administratif","Manajemen roomlist","Pengaturan kamar jamaah","Black Box"],[15,"File Upload","Handler upload file","Sistem upload dokumen","Black Box"],[16,"File Upload","Permission file system","Hak akses file dan direktori","Black Box"],[17,"File Upload","Validasi ukuran file","Batas maksimum ukuran file","Black Box"],[18,"Keamanan","Sanitasi input","Pencegahan XSS dan SQL injection","Black Box"],[19,"Keamanan","Autentikasi admin","Sistem login admin","Black Box"],[20,"Keamanan","Validasi tipe file","Filter ekstensi file yang diizinkan","Black Box"]];
        
        // Hasil Pengujian data  
        const hasilData = [["No","Pengujian","Test Case","Hasil yang diharapkan","Kesimpulan"],[1,"Akses Website","Pemeriksaan file index.php","File tersedia dan dapat diakses","Valid"],[2,"Health Check Endpoint","Pemeriksaan file health.php","File health check tersedia","Valid"],[3,"File Konfigurasi","Pemeriksaan file config.php","File konfigurasi tersedia","Valid"],[4,"Deteksi Environment","Pemeriksaan variabel environment","Environment terdeteksi dengan benar","Valid"],[5,"File Form Pendaftaran","Pemeriksaan file form umroh\/haji","Semua file form tersedia","Valid"],[6,"Validasi Input Form","Testing format NIK, email, telepon","Validasi berfungsi dengan benar","Valid"],[7,"Kemampuan Upload File","Pemeriksaan direktori uploads","Direktori dapat diakses dan ditulis","Valid"],[8,"File Manajemen Paket","Pemeriksaan file admin paket","File manajemen paket tersedia","Valid"],[9,"Struktur Data Paket","Validasi data paket lengkap","Data paket sesuai standar","Valid"],[10,"File Form Pembatalan","Pemeriksaan file pembatalan","File form pembatalan tersedia","Valid"],[11,"Proses Verifikasi","Pemeriksaan file verify_cancellation","File verifikasi tersedia","Valid"],[12,"Akses Panel Admin","Pemeriksaan file admin dashboard","Panel admin dapat diakses","Tidak Valid"],[13,"Export Manifest","Pemeriksaan file export manifest","File export tersedia","Valid"],[14,"Manajemen Kamar","Pemeriksaan file roomlist","File manajemen kamar tersedia","Valid"],[15,"Handler Upload","Pemeriksaan handler upload file","Handler upload tersedia","Valid"],[16,"Permission File","Testing buat\/hapus file test","File dapat dibuat dan dihapus","Valid"],[17,"Validasi Ukuran File","Simulasi file 2MB vs batas 5MB","File dalam batas diterima","Valid"],[18,"Sanitasi Input","Testing input XSS\/SQL injection","Input disanitasi dengan benar","Tidak Valid"],[19,"Autentikasi Admin","Pemeriksaan file admin_auth","Sistem autentikasi tersedia","Tidak Valid"],[20,"Validasi Tipe File","Testing ekstensi file beragam","Hanya file diizinkan diterima","Valid"]];
        
        // Create Rencana Pengujian worksheet
        const wsRencana = XLSX.utils.aoa_to_sheet(rencanaData);
        
        // Style header row for Rencana
        const headerCellsRencana = ["A1", "B1", "C1", "D1", "E1"];
        headerCellsRencana.forEach(cellRef => {
            if (!wsRencana[cellRef]) wsRencana[cellRef] = {v: "", t: "s"};
            wsRencana[cellRef].s = {
                font: {bold: true, sz: 11, color: {rgb: "000000"}},
                alignment: {horizontal: "center", vertical: "center"},
                fill: {patternType: "solid", fgColor: {rgb: "D9D9D9"}},
                border: {
                    top: {style: "medium", color: {rgb: "000000"}},
                    bottom: {style: "medium", color: {rgb: "000000"}},
                    left: {style: "medium", color: {rgb: "000000"}},
                    right: {style: "medium", color: {rgb: "000000"}}
                }
            };
        });
        
        // Set column widths for Rencana
        wsRencana["!cols"] = [
            {wch: 5},   // No
            {wch: 20},  // Modul
            {wch: 35},  // Requirement
            {wch: 40},  // Butir Uji
            {wch: 15}   // Jenis Pengujian
        ];
        
        // Create Hasil Pengujian worksheet
        const wsHasil = XLSX.utils.aoa_to_sheet(hasilData);
        
        // Style header row for Hasil
        const headerCellsHasil = ["A1", "B1", "C1", "D1", "E1"];
        headerCellsHasil.forEach(cellRef => {
            if (!wsHasil[cellRef]) wsHasil[cellRef] = {v: "", t: "s"};
            wsHasil[cellRef].s = {
                font: {bold: true, sz: 11, color: {rgb: "000000"}},
                alignment: {horizontal: "center", vertical: "center"},
                fill: {patternType: "solid", fgColor: {rgb: "D9D9D9"}},
                border: {
                    top: {style: "medium", color: {rgb: "000000"}},
                    bottom: {style: "medium", color: {rgb: "000000"}},
                    left: {style: "medium", color: {rgb: "000000"}},
                    right: {style: "medium", color: {rgb: "000000"}}
                }
            };
        });
        
        // Style Kesimpulan column (column E) based on value
        for (let i = 2; i <= hasilData.length; i++) {
            const cellRef = "E" + i;
            if (wsHasil[cellRef]) {
                const value = wsHasil[cellRef].v;
                if (value === "Valid") {
                    wsHasil[cellRef].s = {
                        font: {bold: true, color: {rgb: "006600"}},
                        fill: {patternType: "solid", fgColor: {rgb: "D4F6D4"}},
                        border: {
                            top: {style: "thin", color: {rgb: "000000"}},
                            bottom: {style: "thin", color: {rgb: "000000"}},
                            left: {style: "thin", color: {rgb: "000000"}},
                            right: {style: "thin", color: {rgb: "000000"}}
                        }
                    };
                } else if (value === "Tidak Valid") {
                    wsHasil[cellRef].s = {
                        font: {bold: true, color: {rgb: "CC0000"}},
                        fill: {patternType: "solid", fgColor: {rgb: "F6D4D4"}},
                        border: {
                            top: {style: "thin", color: {rgb: "000000"}},
                            bottom: {style: "thin", color: {rgb: "000000"}},
                            left: {style: "thin", color: {rgb: "000000"}},
                            right: {style: "thin", color: {rgb: "000000"}}
                        }
                    };
                }
            }
        }
        
        // Set column widths for Hasil
        wsHasil["!cols"] = [
            {wch: 5},   // No
            {wch: 25},  // Pengujian
            {wch: 35},  // Test Case
            {wch: 40},  // Hasil yang diharapkan
            {wch: 15}   // Kesimpulan
        ];
        
        // Add worksheets to workbook
        XLSX.utils.book_append_sheet(wb, wsRencana, "Rencana Pengujian");
        XLSX.utils.book_append_sheet(wb, wsHasil, "Hasil Pengujian");
        
        // Generate filename
        const timestamp = new Date().toISOString().slice(0,19).replace(/[:\-]/g, "").replace("T", "_");
        const filename = `Tabel_Pengujian_MIW_Travel_${timestamp}.xlsx`;
        
        // Save file
        XLSX.writeFile(wb, filename);
        
        alert(`Excel file exported successfully!
        
Filename: ${filename}
Sheets: Rencana Pengujian, Hasil Pengujian
Total Records: 20 test cases
Valid Tests: 17 (85%)
Invalid Tests: 3 (15%)

The file has been downloaded to your Downloads folder.`);
    }
    </script>
</body>
</html>
